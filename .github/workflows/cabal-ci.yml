on:
  - push
  - pull_request

name: Cabal build
jobs:
  cabal:
    name: Cabal test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc:
          - "8.10.7"
          - "9.0.2"
          - "9.2.8"
          - "9.4.8"
          - "9.6.4"
          - "9.8.2"
          - "9.10.1"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - uses: haskell-actions/setup@64445b6b5dd545faf5f8e2acee8253eb5c2b29aa # v2.7.11
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Configure Cabal
        run: cabal configure --enable-optimization --enable-tests

      - name: Build dependencies
        run: cabal build all --dependencies-only

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all
